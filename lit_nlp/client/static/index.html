<!DOCTYPE html>
<html>

  <head>
  <meta charset="UTF-8">
  <title>LIT</title>
  <link href="https://fonts.googleapis.com/css?family=Google+Material+Icons|Material+Icons|Material+Icons+Outlined&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Google+Sans" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto|Roboto:bold" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="static/favicon.png">
  <!-- Add any global styles for body, document, etc. -->
  <style>
    body {
      margin: 0;
      font-family: 'Roboto';
      font-size: 13px;
      line-height: 18px;
    }
  </style>
  <!-- Set the theme class before first paint so native scrollbars and the
       page background match the user's (stored or system) theme choice.
       The full theme token sheet is injected by lib/theme.ts at runtime. -->
  <script>
    (function() {
      var theme = null;
      try {
        theme = window.localStorage.getItem('lit-theme');
      } catch (e) { /* ignore */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = (window.matchMedia &&
                 window.matchMedia('(prefers-color-scheme: dark)').matches) ?
            'dark' : 'light';
      }
      if (theme === 'dark') {
        document.documentElement.classList.add('lit-dark');
      }
    })();
  </script>
</head>



<body>
  <lit-app></lit-app>
  <script src="main.js"></script>
</body>

</html>
